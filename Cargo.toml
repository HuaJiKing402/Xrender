[workspace]
resolver = "2"
members = [
    "crates/renderer-core",
    "crates/app-desktop",
    "crates/app-web",
    "crates/app-android",
    "crates/app-apple",
]
default-members = [
    "crates/renderer-core",
    "crates/app-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[workspace.dependencies]
wgpu = "=30.0.2"
winit = "=0.30.13"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
raw-window-handle = "0.6"
bytemuck = "1"
glam = "0.29"
gltf = "1"
image = "0.25"
encoding_rs = "0.8"
