plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.crossrender.app'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.crossrender.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            jniLibs.srcDirs = ['app/src/main/jniLibs']
        }
    }
}
