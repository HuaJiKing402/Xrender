<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CrossRender Web</title>
  <style>html, body { margin: 0; height: 100%; background: #05050f; } canvas { width: 100vw; height: 100vh; display: block; }</style>
</head>
<body>
  <canvas id="cross-render"></canvas>
  <script type="module">
    import init, { init as initRenderer, render_frame } from './pkg/app_web.js';
    await init();
    await initRenderer('cross-render');
    const loop = () => { render_frame(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  </script>
</body>
</html>
